{% extends "base.html" %}
{% block title %}Drafts{% endblock %}
{% block actions %}
<form hx-post="/drafts/blank" hx-swap="none"><button class="btn" type="submit">{{ icon("plus", 15) }}<span>Blank draft</span></button></form>
<button class="btn primary" type="button" data-open="write-dialog">{{ icon("sparkle", 15) }}<span>Write a post</span></button>
{% endblock %}
{% block content %}
<div id="draft-list" data-region hx-get="/drafts/list?show={{ show }}" hx-trigger="jobs-changed[detail.kind=='draft'] from:body" hx-swap="innerHTML">
{% include "_draft_list.html" %}
</div>

<dialog id="write-dialog" class="dialog">
  <form hx-post="/drafts/write" hx-swap="none" data-errors
        hx-on::after-request="if (event.detail.successful) { this.reset(); this.closest('dialog').close(); }">
    <div class="dialog-head"><h2>Write a post</h2><button type="button" class="icon-btn" data-close aria-label="Close">{{ icon("x") }}</button></div>
    <div class="dialog-body">
      <div class="field">
        <label for="topic">What is the post about?</label>
        <textarea class="input" id="topic" name="topic" rows="4" required autofocus style="min-height:96px"
          placeholder="A topic, an angle or a rough idea. Real numbers and names make the draft stronger."></textarea>
      </div>
      <div class="field">
        <label>What should it earn?</label>
        <div class="seg" data-input="goal" role="radiogroup">
          <button type="button" class="on" data-value="">Let it pick</button>
          {% for g in goals %}<button type="button" data-value="{{ g }}">{{ g|capitalize }}</button>{% endfor %}
        </div>
        <input type="hidden" name="goal" value="">
      </div>
      <div class="grid cols-2">
        <div class="field">
          <label for="length">Length</label>
          <select class="input" id="length" name="length">
            <option value="medium 900-1300 chars">Medium · 900-1,300</option>
            <option value="short 300-500 chars">Short · 300-500</option>
            <option value="long 1500-1900 chars">Long · 1,500-1,900</option>
          </select>
        </div>
        <div class="field">
          <label for="w-audience">Audience <span class="opt">optional</span></label>
          <input class="input" type="text" id="w-audience" name="audience" placeholder="e.g. product managers">
        </div>
      </div>
      <div class="form-error" hidden></div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">{{ icon("sparkle", 15) }}<span>Draft it</span></button>
    </div>
  </form>
</dialog>
{% endblock %}
