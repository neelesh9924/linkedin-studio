<div class="stack-s"{% if running %} hx-get="/settings/health/{{ name }}" hx-trigger="every 2s" hx-target="#health-{{ name }}" hx-swap="innerHTML"{% endif %}>
  <div class="row">
    {% if running %}
      <span class="orb"></span><span class="soft">Running…</span>
    {% else %}
      <button type="button" class="btn" hx-post="/settings/health/{{ name }}" hx-target="#health-{{ name }}" hx-swap="innerHTML" hx-disabled-elt="this">{{ icon("activity", 15) }}<span>{{ 'Run again' if row else 'Run' }}</span></button>
      {% if row %}
      <span class="chip {{ 'ok' if row.exit_code == 0 else 'bad' }}">{{ 'All good' if row.exit_code == 0 else 'Found a problem' }}</span>
      <span class="muted small">{{ row.ran_at|ago }}</span>
      {% endif %}
    {% endif %}
  </div>
  {% if row and not running %}
  <details class="fold"{{ ' open' if row.exit_code != 0 }}><summary>What it reported</summary><div class="fold-body"><pre class="mono-out">{{ row.output }}</pre></div></details>
  {% endif %}
</div>
